  <path d="M268 268 H294 V370 C294 378 288 384 280 384 C272 384 268 376 268 368 Z" fill="#059669" />
  <!-- Right Center Pillar (slanted upward accent) -->
  <path d="M306 268 H332 L320 376 C318 382 312 386 306 386 Z" fill="#059669" />

  <!-- Dynamic Slash Accents on Stem -->
  <path d="M268 312 L294 296 V308 L268 324 Z" fill="#ffffff" />
  <path d="M306 312 L332 296 V308 L306 324 Z" fill="#ffffff" />

  <!-- Brand Typography: TITENFIN -->
