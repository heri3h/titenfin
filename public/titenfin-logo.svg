  <line x1="300" y1="455" x2="300" y2="500" stroke="#059669" stroke-width="20" stroke-linecap="round" />
  <line x1="70" y1="270" x2="115" y2="270" stroke="#059669" stroke-width="20" stroke-linecap="round" />
  <line x1="485" y1="270" x2="530" y2="270" stroke="#059669" stroke-width="20" stroke-linecap="round" />
  <line x1="137" y1="107" x2="169" y2="139" stroke="#059669" stroke-width="20" stroke-linecap="round" />
  <line x1="431" y1="401" x2="463" y2="433" stroke="#059669" stroke-width="20" stroke-linecap="round" />
  <line x1="137" y1="433" x2="169" y2="401" stroke="#059669" stroke-width="20" stroke-linecap="round" />
  <line x1="431" y1="139" x2="463" y2="107" stroke="#059669" stroke-width="20" stroke-linecap="round" />

  <!-- Central Stylized Aerodynamic 'T' Emblem -->
  <!-- Left Wing Upper -->
  <path d="M205 190 H285 L275 218 H205 Z" fill="#059669" />
  <!-- Right Wing Upper -->
  <path d="M305 190 H395 L375 218 H315 Z" fill="#059669" />
  <!-- Left Wing Lower -->
